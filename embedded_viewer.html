<!-- The only subresources the page does not carry itself. Each is pinned to an
     exact version AND to an SRI hash, so a tampered or swapped CDN response is
     rejected by the browser before it runs — which matters here because a
     script on this origin can read the OpenRouter key and every saved trip out
     of localStorage.
     Both are served from jsdelivr's /npm/ paths, which return the published
     tarball file byte-for-byte. That is what makes the hashes derivable from
     (and checkable against) the pinned devDependencies —
     tests/unit/sri.test.js recomputes them, so bumping a version without
     updating its hash fails the build rather than the page. Leaflet moved here
     from cdnjs for that reason: cdnjs's leaflet.min.js is a filename cdnjs
     mints itself, with nothing local to check it against. -->

<!-- A chat host sizes the frame to the height this page reports, so a
     100vh-based schedule would chase its own tail, growing with every resize
     (issue #138). The embedded page gives the schedule its natural height and
     lets the host's page scroll. The standalone page keeps the viewport fit
     in styles.css. -->
<style>.hgt-wrap{height:auto;min-height:0}.hgt-scroll{overflow-y:visible}</style>

<!-- Each screen owns its own <h1> (issue #92), and only one of the two is ever
     displayed: the opening screen's is sr-only prose describing the app, the
     open trip's is its name in the header. A single page-level <h1> sitting
     above both would put an h1 after the day headings once a trip is open. -->
<!-- The one warning banner (see the invariant in CLAUDE.md): the upload
     guards, the import decision, the saved-data version guard, a failed share
     link and a room's conflict (issue #124) are all this element, raised
     through showUploadWarning() and put away through hideWarning().
     It sits above BOTH screens rather than inside the opening one, because a
     room's conflict arrives while a trip is open — parked inside #hupl it was
     display:none exactly when it had something to say. -->
<div id="hverwarn" style="display:none;max-width:460px;margin:1rem auto;background:var(--color-background-warning);color:var(--color-text-warning);border-radius:var(--border-radius-lg);padding:.85rem 1rem;font-size:12px;line-height:1.45"></div>

<div id="hupl" style="padding:2.5rem 1.5rem">
  <!-- The embedded page has no upload screen: the host page around it hands
       it the trip through window.HolidayViewer.show() (src/main.js). Until
       then this is all it shows. -->
  <h1 class="sr-only">Holiday itinerary viewer</h1>
  <p style="text-align:center;font-size:13px;color:var(--color-text-secondary)">Loading the trip…</p>
</div>

<div id="happ" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:.75rem 1.25rem;border-bottom:.5px solid var(--color-border-tertiary)">
    <h1 id="htname" style="margin:0;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h1>
    <!-- Four icon buttons, and they are the whole toolbar. The row had grown to
         seven controls plus a variable-width pill, which crushed the trip name
         at every width (the group does not shrink) and ellipsised the one
         message that has to be readable. So: status moved out to its own strip
         below, Download joined "Send a copy" in the share sheet — same intent,
         getting the trip out of here — and Close joined the switcher, which is
         where the other trip-lifecycle actions already live. Anything new goes
         into one of those homes, not back into this row. -->
    <div style="display:flex;gap:8px;flex-shrink:0;align-items:center">
      <!-- The trip switcher (issue #80): several trips live here, and this is
           where you flip between them, wind one back, forget one, or put this
           one down. -->
      <!-- Sharing is a choice now (issue #124): a frozen copy, or a live room
           that stays current. Either way the link is the whole itinerary, and
           the confirmation on it says so out loud (issue #81). -->
    </div>
  </div>
  <!-- Live sharing's status (issue #124), shown only while this trip is in a
       room: how far the shared copy is behind, or that someone else's changes
       are waiting. It is status rather than an action, which is why it is a
       strip of its own rather than another button in the toolbar — here it has
       room for the whole sentence instead of an ellipsis. It is still the retry
       after a failed push and the way into a parked decision, so it stays a
       button. The strip scrolls away with the header, so the space it costs is
       only ever the top of the page. -->
  <!-- Shown only when a save failed: iOS private browsing rejects every write,
       and the download is the durable copy either way (issue #80). -->
  <!-- ARIA tabs pattern (issue #90): the strip is ONE tab stop, and Left/Right
       (plus Home/End) move along it — the roving tabindex and aria-selected are
       kept in step by switchView() in app.js, the keys by the .htabs listener in
       main.js. Buttons rather than divs so Enter/Space work without a key
       handler; .htab resets the UA button chrome to keep the look. -->
  <div class="htabs" role="tablist" aria-label="Views">
    <!-- Labels are the user's words (issue #71); the data-v keys stay the
         internal view names (list, gantt) that the code and tests use. -->
    <button type="button" id="htab-list" class="htab on" role="tab" aria-selected="true" aria-controls="hvlist" tabindex="0" data-v="list" onclick="hsw('list')"><i class="ti ti-list-details" aria-hidden="true"></i> Itinerary</button>
    <button type="button" id="htab-map" class="htab" role="tab" aria-selected="false" aria-controls="hvmap" tabindex="-1" data-v="map" onclick="hsw('map')"><i class="ti ti-map-2" aria-hidden="true"></i> Map</button>
    <button type="button" id="htab-gantt" class="htab" role="tab" aria-selected="false" aria-controls="hvgantt" tabindex="-1" data-v="gantt" onclick="hsw('gantt')"><i class="ti ti-calendar-time" aria-hidden="true"></i> Schedule</button>
    <button type="button" id="htab-lists" class="htab" role="tab" aria-selected="false" aria-controls="hvlists" tabindex="-1" data-v="lists" onclick="hsw('lists')"><i class="ti ti-checklist" aria-hidden="true"></i> Lists</button>
    <button type="button" id="htab-phrases" class="htab" role="tab" aria-selected="false" aria-controls="hvphrases" tabindex="-1" data-v="phrases" onclick="hsw('phrases')"><i class="ti ti-message-language" aria-hidden="true"></i> Phrases</button>
    <button type="button" id="htab-budget" class="htab" role="tab" aria-selected="false" aria-controls="hvbudget" tabindex="-1" data-v="budget" onclick="hsw('budget')"><i class="ti ti-coins" aria-hidden="true"></i> Budget</button>
  </div>
  <div id="hvlist" class="hv on" role="tabpanel" aria-labelledby="htab-list" tabindex="-1" style="padding:1.25rem;max-width:760px"></div>
  <div id="hvbudget" class="hv" role="tabpanel" aria-labelledby="htab-budget" tabindex="-1" style="padding:1.25rem;max-width:760px"></div>
  <div id="hvlists" class="hv" role="tabpanel" aria-labelledby="htab-lists" tabindex="-1" style="padding:1.25rem;max-width:760px"></div>
  <div id="hvphrases" class="hv" role="tabpanel" aria-labelledby="htab-phrases" tabindex="-1" style="padding:1.25rem;max-width:760px"></div>
  <div id="hvmap" class="hv" role="tabpanel" aria-labelledby="htab-map" tabindex="-1" style="padding:1.25rem">
    <div style="display:flex;gap:8px;font-size:11px;color:var(--color-text-secondary);margin-bottom:8px;align-items:center">
      <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;border:.5px solid var(--color-border-secondary);background:#4b5563;display:inline-block"></span>Station</span>
      <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;border:.5px solid var(--color-border-secondary);background:#b45309;display:inline-block"></span>Stay</span>
      <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;border:.5px solid var(--color-border-secondary);background:#15803d;display:inline-block"></span>Event</span>
      <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:16px;height:0;border-top:2px dashed #6366f1;display:inline-block"></span>Route</span>
    </div>
    <div id="hmap" style="width:100%;height:440px;border-radius:var(--border-radius-lg);border:.5px solid var(--color-border-tertiary)"></div>
    <div id="hmaplist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-top:1rem"></div>
  </div>
  <div id="hvgantt" class="hv" role="tabpanel" aria-labelledby="htab-gantt" tabindex="-1" style="padding:0"></div>
</div>






<!-- The one polite live region (issue #93), written by views/focus.js when a
     view mutates: "Bordeaux ticked off. 4 of 8 done.", "Deleted Bordeaux. Undo
     available.". It lives in the static markup because a region created and
     populated in the same frame does not announce reliably — it has to be in
     the DOM before anything writes to it. Polite, because nothing said here is
     worth interrupting for. aria-atomic is spelled out rather than left to
     role="status"'s implicit value: without it a reader may announce only the
     text node that changed instead of the whole sentence. -->
<div id="hlive" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
